<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#121a16">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<title>Painel | Casa Navalha</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Hanken+Grotesk:wght@400;500;700&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Hanken+Grotesk:wght@400;500;700&display=swap"></noscript>
<link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"></noscript>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div id="notes" aria-live="polite"></div>

<div class="login" id="login"><form id="lf" novalidate>
  <div class="logo">Casa <b>Navalha</b></div><h1>Entrar no painel</h1>
  <label for="em">E-mail</label><input id="em" type="email" autocomplete="username" required>
  <label for="pw">Senha</label><input id="pw" type="password" autocomplete="current-password" required>
  <p class="err" id="le" role="alert"></p><p class="hint" id="lh"></p>
  <button class="btn btn-primary" type="submit">Entrar</button>
  <button class="link" type="button" data-a="reset">Esqueci minha senha</button>
  <a class="link" href="index.html">Voltar ao site</a>
</form></div>

<div id="app" hidden>
  <header><nav>
    <a class="logo" href="admin.html">Casa <b>Navalha</b> <span>Painel</span></a>
    <div class="tabs" id="tabs">
      <button data-tab="agenda"><i class="bx bx-calendar"></i> Agenda</button>
      <button data-tab="clientes"><i class="bx bx-user-pin"></i> Clientes</button>
      <button data-tab="reports"><i class="bx bx-bar-chart"></i> Relatórios</button>
      <button data-tab="config"><i class="bx bx-cog"></i> Configurações</button>
    </div>
    <div class="actions"><a class="btn btn-light btn-sm" href="index.html" target="_blank" rel="noopener"><i class="bx bx-link-external"></i> Ver site</a><button class="btn btn-light btn-sm" data-a="logout"><i class="bx bx-log-out"></i> Sair</button></div>
  </nav></header>
  <main id="view"></main>
</div>

<div class="overlay" id="modal"><div class="mc" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="mh"><h3 id="mTitle"></h3><button class="x" data-a="close" aria-label="Fechar">×</button></div>
  <div class="mb" id="mBody"></div><div class="mf" id="mFoot"></div>
</div></div>

<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
